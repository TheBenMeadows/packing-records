name = "packing"
version = "0.1.0"
defaultTargets = ["Packing"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# The bounds, the certificate checker and its soundness proof.
[[lean_lib]]
name = "Packing"

# One theorem per record cell. Needs the files written by gen/gen_cert.py.
[[lean_lib]]
name = "PackingCells"

# The best arrangement of ten points in a cube: checker, soundness proof and 40 data files that
# need up to 16 GB of memory each. `lake build` leaves all of it out, so that the statements in
# Challenge/ stay as they are: build with `lake build PackingCube10` or `gate/build_cube10.sh`.
[[lean_lib]]
name = "PackingCube10"

# Trusted statement of the ten-point theorem for `lake comparator --config comparator_cube10.json`.
[[lean_lib]]
name = "ChallengeCube10"

# Trusted statements for `lake comparator`: Mathlib only, definitions copied from Packing,
# every theorem closed with `sorry`. Read these files to check what is proved.
[[lean_lib]]
name = "Challenge"

# The module `lake comparator` judges against Challenge (needs the seven sampled cell files).
[[lean_lib]]
name = "Solution"
